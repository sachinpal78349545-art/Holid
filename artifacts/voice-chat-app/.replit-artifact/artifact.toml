kind = "web"
previewPath = "/"
title = "Galaxy Voice Chat"
description = "A real-time voice chat community app with live rooms, messaging, profiles, social features, games, and virtual gifts."
version = "1.0.0"
id = "artifacts/voice-chat-app"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21231

[services.development]
run = "pnpm --filter @workspace/voice-chat-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/voice-chat-app", "run", "build" ]
serve = "static"
publicDir = "artifacts/voice-chat-app/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21231"
BASE_PATH = "/"
